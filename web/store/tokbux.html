<!doctype html>
<!-- The TokBux store page (like Roblox's Robux packages, a web page inside the app). The app opens it full screen
     (gametok/src/components/TokBuxSheet.tsx), tells it the balance and the packs with the store's prices, and does
     the purchase itself (Apple / Google in-app purchase) when a price is tapped. Published to R2 by
     tools/publish_store.mjs; it can change without an app release.
     App -> page: window.GAMETOK_STORE before load, then {type:'STORE_STATE', ...} messages.
       { balance, packs: [{ id, tokbux, price }], forYou, busy }   price null = not on sale on this build
     Page -> app: {type:'READY'} {type:'BUY', id} {type:'CLOSE'} {type:'OPEN', url} -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TokBux</title>
<style>
  :root { --bg: #0d0a16; --card: #17121f; --btn: rgba(255,255,255,0.1); --dim: rgba(255,255,255,0.55); --accent: #a855f7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui, Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  body { padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  .head { display: flex; align-items: center; height: 48px; }
  .x { width: 32px; height: 32px; display: grid; place-items: center; }
  .x svg { width: 26px; height: 26px; }
  .coin { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .bal { display: flex; align-items: center; gap: 6px; margin-left: 14px; font-weight: 800; font-size: 18px; }
  h1 { font-size: 22px; font-weight: 800; margin: 10px 0 0; }
  .fine { color: var(--dim); font-size: 12px; line-height: 17px; margin: 6px 0 16px; }
  .fine a { color: #fff; font-weight: 700; text-decoration: none; }
  .card { background: var(--card); border-radius: 18px; padding: 6px 16px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 0; }
  .amount { font-size: 22px; font-weight: 800; }
  .chip { display: flex; align-items: center; gap: 4px; background: var(--btn); color: var(--dim); border-radius: 999px;
    padding: 3px 8px; font-size: 11px; font-weight: 700; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--dim); position: relative; }
  .chip i::after { content: ''; position: absolute; inset: 1px; border-radius: 50%; background: var(--dim); }
  .price { margin-left: auto; background: var(--btn); border-radius: 10px; height: 40px; min-width: 112px; font-weight: 700;
    font-size: 14px; display: grid; place-items: center; transition: transform .1s, opacity .1s; }
  .price:active { transform: scale(0.96); }
  .price.on { background: var(--accent); }
  .price[disabled] { opacity: 0.6; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff;
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-size: 20px; font-weight: 800; margin: 28px 0 10px; }
  .faq { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
  .faq summary { list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary svg { width: 18px; height: 18px; color: var(--dim); transition: transform .15s; }
  .faq[open] summary svg { transform: rotate(180deg); }
  .faq p { color: var(--dim); font-size: 14px; line-height: 20px; margin: 8px 0 0; }
</style>
</head>
<body>
  <div class="head">
    <button class="x" id="close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="bal"><img class="coin" src="tokbux.png" alt=""><span id="balance">0</span></div>
  </div>
  <h1>TokBux packages</h1>
  <p class="fine">By buying TokBux, you agree to our <a href="https://gametok.co/terms.html" id="terms">Terms of Use</a>.</p>
  <div class="card" id="packs"></div>

  <h2>FAQ</h2>
  <div id="faq"></div>

<script>
const FAQ = [
  ['What are TokBux?', 'GameTok’s one currency. Spend them on avatar items in Me, and on heroes and more inside GameTok games.'],
  ['Where are my TokBux?', 'They’re added to your account a few seconds after you buy, and show next to your picture everywhere.'],
  ['Do TokBux expire?', 'No. They stay on your account until you spend them.'],
];
const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
document.getElementById('faq').innerHTML = FAQ.map(([q, a]) =>
  `<details class="faq"><summary>${q}${chevron}</summary><p>${a}</p></details>`).join('');

const send = (msg) => window.ReactNativeWebView?.postMessage(JSON.stringify(msg));
// a preview outside the app shows the packs at the suggested US prices
let state = window.GAMETOK_STORE || { balance: 0, forYou: 'tokbux_500', busy: null, packs: [
  { id: 'tokbux_80', tokbux: 80, price: '$0.99' }, { id: 'tokbux_500', tokbux: 500, price: '$4.99' },
  { id: 'tokbux_1200', tokbux: 1200, price: '$9.99' }, { id: 'tokbux_3000', tokbux: 3000, price: '$19.99' },
  { id: 'tokbux_8500', tokbux: 8500, price: '$49.99' }] };

function render() {
  document.getElementById('balance').textContent = state.balance.toLocaleString('en-US');
  const packs = [...state.packs].sort((a, b) => b.tokbux - a.tokbux);
  document.getElementById('packs').innerHTML = packs.map((p) => {
    const forYou = p.id === state.forYou, busy = state.busy === p.id;
    return `<div class="row">
      <img class="coin" src="tokbux.png" alt="">
      <span class="amount">${p.tokbux.toLocaleString('en-US')}</span>
      ${forYou ? '<span class="chip"><i></i>For you</span>' : ''}
      <button class="price${forYou ? ' on' : ''}" data-id="${p.id}" ${state.busy ? 'disabled' : ''}>${busy ? '<span class="spin"></span>' : p.price ?? 'Soon'}</button>
    </div>`;
  }).join('');
}
document.getElementById('packs').addEventListener('click', (e) => {
  const b = e.target.closest('.price');
  if (b && !state.busy) send({ type: 'BUY', id: b.dataset.id });
});
document.getElementById('close').onclick = () => send({ type: 'CLOSE' });
document.getElementById('terms').onclick = (e) => { if (window.ReactNativeWebView) { e.preventDefault(); send({ type: 'OPEN', url: e.currentTarget.href }); } };
// messages from the app come with no source
const onMessage = (e) => {
  try { const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; if (d?.type === 'STORE_STATE') { state = { ...state, ...d }; render(); } } catch {}
};
window.addEventListener('message', onMessage);
document.addEventListener('message', onMessage);   // Android
render();
send({ type: 'READY' });
</script>
</body>
</html>
